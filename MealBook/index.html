<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MealBook</title>
<meta name="theme-color" content="#e8a317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MealBook">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
:root{color-scheme:light;--bg:#f6f7f4;--card:#fff;--ink:#1d2330;--mut:#667085;--line:#e3e6df;--b:#e8a317;--l:#3f9d5a;--s:#e2573f;--e:#d6528a;--n:#4a5bd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151c;--card:#1b2029;--ink:#eef0f4;--mut:#9aa3b2;--line:#2a303c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151c;--card:#1b2029;--ink:#eef0f4;--mut:#9aa3b2;--line:#2a303c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2{margin:0;font-weight:700;letter-spacing:-.02em}
h1{font-size:30px;line-height:1.15}
h2{font-size:19px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--n);outline-offset:2px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.mut{color:var(--mut);font-size:14px;margin:0}
.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600}
.btn.o{background:none;color:var(--ink);border:1.5px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.meal{display:block;width:100%;text-align:left;margin-top:12px;border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card));border-radius:6px 18px 18px 6px;padding:14px 16px}
.dish{margin-top:12px;border-left:5px solid var(--c)}
.th{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.ph{display:flex;gap:8px;overflow-x:auto;margin-top:8px;align-items:center}
.ph:empty{display:none}
.pw{position:relative;flex:none}
.x{position:absolute;top:-6px;right:-6px;background:var(--ink);color:var(--bg);border-radius:50%;width:22px;height:22px;line-height:1}
input,textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.st{font-size:26px;color:var(--line);padding:0 2px}
.st.on,.rt{color:var(--b)}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg)}
.msg.a{background:var(--card);border:1px solid var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;padding:6px;border-radius:12px;font-size:13px}
nav .on{background:color-mix(in srgb,var(--ink) 10%,transparent);font-weight:700}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9}
.zoom img{max-width:94%;max-height:90%;border-radius:12px}
select{font:inherit;color:inherit;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.mb{font-size:18px;padding:4px 10px;border-radius:10px;border:1.5px solid var(--line)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;z-index:5}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const pd=s=>new Date(s+"T00:00");
const fmt=(s,o)=>pd(s).toLocaleDateString(undefined,o);
const uid=()=>Math.random().toString(36).slice(2,9);
const M=[["breakfast","Breakfast","🍳","--b"],["lunch","Lunch","🍛","--l"],["snacks","Snacks","🥟","--s"],["desserts","Desserts","🍮","--e"],["dinner","Dinner","🌙","--n"]];
const T0=iso(new Date());
let S={ideas:[]},v={tab:"day",meal:null,draft:null,zoom:null,del:null,err:"",recmeal:"breakfast",recommendations:null,recmessage:"",chat:[],busy:0};
const IL=()=>(S.ideas=S.ideas||[]);
const dishes=m=>IL().filter(i=>i.meal===m);
const idl=()=>IL().map(i=>i.name+(i.meal?" ("+i.meal+")":"")).join("; ")||"(none)";
const mname=k=>(M.find(x=>x[0]===k)||[])[1]||"";

/* storage: IndexedDB, private to this browser */
const idb=new Promise((ok,no)=>{try{const r=indexedDB.open("mealbook",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>ok(r.result);r.onerror=()=>no()}catch(e){no(e)}});
const load=async()=>{try{const d=await idb;return await new Promise(ok=>{const q=d.transaction("kv").objectStore("kv").get("s");q.onsuccess=()=>ok(q.result);q.onerror=()=>ok()})}catch(e){}};
const save=async()=>{try{const d=await idb;d.transaction("kv","readwrite").objectStore("kv").put(S,"s")}catch(e){}};
const putIdea=d=>{const L=IL(),i=L.findIndex(x=>x.id===d.id);i<0?L.unshift(d):L[i]=d;save()};
/* photos: shrink to 800px JPEG */
const shrink=f=>new Promise(ok=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.72))};i.onerror=()=>ok(null);i.src=r.result};r.onerror=()=>ok(null);r.readAsDataURL(f)});

/* Menu ideas are stored by meal category, not by date. */

const ai=async(p,o)=>{if(!window.claude)throw new Error("AI is not available in this browser. Open this app in the environment that provides AI access.");const s=await claude.use("sample");if(!s)throw new Error("AI access is unavailable.");return (await s(p,o||{})).text};
const ideaContext=()=>IL().map(i=>`${mname(i.meal)}: ${i.name}${i.notes?" — "+i.notes:""}`).join("\n")||"(No saved ideas yet)";
const getRecommendations=async()=>{v.recmessage="";v.recommendations=null;v.busy=1;render();try{const t=await ai(`You are a friendly meal idea assistant. The user has saved these menu ideas:\n${ideaContext()}\nRecommend 3 options for ${mname(v.recmeal)}. Prefer their saved ideas where suitable, and include a new idea if helpful. Reply ONLY with a JSON array of objects with name and why fields.`,{cache:false,modelTier:"quick"});v.recommendations=JSON.parse(t.slice(t.indexOf("["),t.lastIndexOf("]")+1)).slice(0,3)}catch(e){v.recmessage=e.message||"Could not get recommendations. Check that AI access is enabled."}v.busy=0;render()};
const ask=async()=>{const el=$("[name=cq]"),q=el&&el.value;if(!q||!q.trim()||v.busy)return;v.chat.push({r:"u",t:q.trim()});v.busy=1;render();try{const t=await ai(`You are MealBook AI. Answer the user's question using their saved menu ideas below. Be friendly and concise. If the saved ideas don't contain enough information, say so and offer general meal suggestions clearly as suggestions.\nSAVED IDEAS:\n${ideaContext()}\nQUESTION: ${q.trim()}`,{cache:false});v.chat.push({r:"a",t:t.trim()})}catch(e){v.chat.push({r:"a",t:e.message||"I couldn't reach AI. Please check AI access for this page."})}v.busy=0;render()};

/* views */
const dayView=()=>`<h1>MealBook</h1><p class="mut" style="margin-top:6px">Your personal menu ideas. Tap a meal to save dishes you might make.</p>`
 +M.map(([k,n,ic,c])=>{const L=dishes(k);return `<button class="meal" style="--c:var(${c})" data-act="open" data-k="${k}"><div class="row"><span style="font-size:28px">${ic}</span><div class="sp"><h2>${n}</h2><div class="mut t">${L.length?esc(L.map(d=>d.name).join(", ")):"No ideas saved yet"}</div></div></div></button>`}).join("");

const form=()=>{const d=v.draft;return `<div class="card" style="margin-bottom:12px"><input name="name" placeholder="Dish name" value="${esc(d.name)}" aria-label="Dish name"><textarea name="notes" rows="3" placeholder="Ingredients, recipe or notes (optional)" aria-label="Notes" style="resize:vertical">${esc(d.notes)}</textarea><div class="row" style="margin-top:8px"><span class="mut">Rating</span>${[1,2,3,4,5].map(i=>`<button class="st ${i<=d.r?"on":""}" data-act="rate" data-i="${i}" aria-label="${i} stars">★</button>`).join("")}</div><div class="ph">${d.photos.map((p,i)=>`<span class="pw"><img class="th" src="${p}" alt=""><button class="x" data-act="rmp" data-i="${i}" aria-label="Remove photo">×</button></span>`).join("")}</div><button class="btn o" data-act="pick" style="margin-top:8px">📷 Add photos</button><input id="fi" type="file" accept="image/*" multiple hidden>${v.err?`<p class="mut" role="alert" style="margin-top:8px">${v.err}</p>`:""}<div class="row" style="margin-top:12px"><button class="btn sp" data-act="save">Save dish</button><button class="btn o" data-act="cancel">Cancel</button></div></div>`};

const mealView=()=>{const [k,n,ic,c]=M.find(x=>x[0]===v.meal),L=dishes(k);
 return `<div style="--c:var(${c})"><div class="row"><button class="btn o" data-act="back" aria-label="Back to meals">‹</button><h1 class="sp">${ic} ${n} ideas</h1></div><p class="mut" style="margin:4px 0 12px">Save dishes here anytime — no dates or daily tracking.</p>`
 +(v.draft?form():`<button class="btn" data-act="new" style="width:100%">＋ Add an idea</button>`)
 +(L.length?L.map(d=>`<div class="card dish"><div class="row"><b class="sp">${esc(d.name)}</b><button data-act="edit" data-id="${d.id}" aria-label="Edit ${esc(d.name)}">✏️</button><button data-act="del" data-id="${d.id}" aria-label="Delete ${esc(d.name)}">${v.del===d.id?"Delete?":"🗑️"}</button></div>${d.notes?`<p class="mut" style="margin-top:6px;white-space:pre-wrap">${esc(d.notes)}</p>`:""}<div class="ph">${d.photos.map(p=>`<img class="th" src="${p}" data-act="zoom" alt="Photo of ${esc(d.name)}">`).join("")}</div></div>`).join(""):`<p class="mut" style="margin-top:12px">No ideas yet. Add something like dosa, idli, or pancakes.</p>`)
 +`</div>`};

const recommendationView=()=>`<h1>✨ Daily picks</h1><p class="mut" style="margin-top:6px">Get suggestions based on the ideas you have saved in MealBook.</p>
<div class="card" style="margin-top:14px"><label for="recmeal">Choose a meal</label><select id="recmeal" name="recmeal">${M.map(([k,n])=>`<option value="${k}" ${v.recmeal===k?"selected":""}>${n}</option>`).join("")}</select><button class="btn" data-act="recommend" style="width:100%;margin-top:12px">✨ Recommend dishes</button></div>
${v.recommendations?`<div style="margin-top:14px"><h2>Suggestions for ${esc(mname(v.recmeal||"breakfast"))}</h2>${v.recommendations.map(x=>`<div class="card" style="margin-top:8px"><b>${esc(x.name)}</b><p class="mut" style="margin-top:4px">${esc(x.why)}</p></div>`).join("")}</div>`:""}
${v.recmessage?`<p class="mut" role="status" style="margin-top:12px">${esc(v.recmessage)}</p>`:""}`;

const askView=()=>`<h1>💬 Ask MealBook AI</h1><p class="mut" style="margin-top:6px">Ask questions about your saved menu ideas, like “What can I make with my lunch ideas?” or “Suggest something different from my usual breakfast ideas.”</p>
<div class="chat">${v.chat.map(m=>`<div class="msg ${m.r}">${esc(m.t)}</div>`).join("")}${v.busy?`<div class="msg a mut">Thinking…</div>`:""}</div>
<div class="row" style="margin-top:12px"><input name="cq" placeholder="Ask about your saved ideas" aria-label="Your question" style="margin:0"><button class="btn" data-act="ask">Send</button></div>
<p class="mut" style="margin-top:8px">AI needs to be enabled by the environment hosting this HTML file. If it is unavailable, the app will show a message.</p>`;

const boxView=()=>`<h1>Menu ideas</h1><p class="mut" style="margin-top:4px">Choose Breakfast, Lunch, Snacks, Desserts or Dinner from Meals to add ideas.</p>`;

const nav=()=>`<nav>${[["day","🍽️","Meals"],["recommend","✨","Daily picks"],["ask","💬","Ask AI"]].map(([t,i,n])=>`<button class="${(v.tab===t)?"on":""}" data-act="tab" data-t="${t}">${i}<br>${n}</button>`).join("")}</nav>`;

function render(){const fn=document.activeElement&&document.activeElement.name;
 $("#app").innerHTML=`<main>${v.meal?mealView():v.tab==="recommend"?recommendationView():v.tab==="ask"?askView():dayView()}</main>`+nav()+(v.toast?`<div class="toast" role="status">${esc(v.toast)}</div>`:"")+(v.zoom?`<div class="zoom" data-act="unzoom"><img src="${v.zoom}" alt="Photo"></div>`:"");
 if(v.tab==="hist")sres();
 if(fn){const e=$(`[name="${fn}"]`);if(e)e.focus()}}

/* actions: return false to skip re-render */
const A={
 open:a=>{v.meal=a.dataset.k;v.draft=null;v.err=""},
 back:()=>{v.meal=null;v.draft=null;v.err=""},
 new:()=>{v.err="";v.draft={id:"",name:"",notes:"",r:0,photos:[]}},
 edit:a=>{const d=dishes(v.meal).find(x=>x.id===a.dataset.id);if(d){v.err="";v.draft={...d,photos:[...d.photos]}}},
 del:a=>{if(v.del===a.dataset.id){S.ideas=IL().filter(x=>x.id!==a.dataset.id);v.del=null;save()}else v.del=a.dataset.id},
 rate:a=>{v.draft.r=v.draft.r===+a.dataset.i?0:+a.dataset.i},
 pick:()=>{$("#fi").click();return false},
 rmp:a=>{v.draft.photos.splice(+a.dataset.i,1)},
 cancel:()=>{v.draft=null;v.err=""},
 save:()=>{const d=v.draft;if(!d.name.trim()){v.err="Give the dish a name.";return}putIdea({...d,name:d.name.trim(),id:d.id||uid(),meal:v.meal});v.draft=null;v.err=""},
 zoom:a=>{v.zoom=a.src},
 unzoom:()=>{v.zoom=null},
 tab:a=>{v.tab=a.dataset.t;v.meal=null;v.draft=null;v.err=""},
 recommend:()=>{const sel=$("#recmeal");if(sel)v.recmeal=sel.value;getRecommendations();return false},
 ask:()=>{ask();return false}
};
document.addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(!a)return;v.toast="";if(!/^del/.test(a.dataset.act))v.del=null;if(A[a.dataset.act](a)!==false)render()});
document.addEventListener("input",e=>{const t=e.target;if(v.draft&&(t.name==="name"||t.name==="notes"))v.draft[t.name]=t.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.name==="cq")ask()});
document.addEventListener("change",async e=>{if(e.target.id!=="fi"||!v.draft)return;
 for(const f of e.target.files){const p=await shrink(f);if(p)v.draft.photos.push(p)}render()});

render();
load().then(s=>{if(s){if(Array.isArray(s.ideas)){S={ideas:s.ideas}}else{const ideas=[];if(s.d)Object.values(s.d).forEach(byMeal=>Object.entries(byMeal||{}).forEach(([meal,list])=>(list||[]).forEach(d=>ideas.push({...d,meal}))));S={ideas};save()}render()}});
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</body>
</html>
